AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM Automation Lab — Creates IAM users (ec2-user1, ec2-user2, s3-user),
  user groups with scoped permissions, a shared temporary password stored
  in Secrets Manager, and enforces password-reset on first login.
  Designed for GitSync deployment.

Parameters:
  PasswordLength:
    Type: Number
    Default: 16
    MinValue: 12
    MaxValue: 32
    Description: Length of the auto-generated temporary password.

  SecretName:
    Type: String
    Default: "iam-lab/temp-console-password"
    Description: Name of the Secrets Manager secret that stores the temp password.

Resources:

  TempConsolePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Ref SecretName
      Description: "Auto-generated temporary password assigned to all IAM lab users."
      GenerateSecretString:
        SecretStringTemplate: '{"username": "iam-lab-users"}'
        GenerateStringKey: "password"
        PasswordLength: !Ref PasswordLength
        ExcludeCharacters: '"@/\\'
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: IAMLab
        - Key: ManagedBy
          Value: CloudFormation

  EC2Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2LabGroup
      Policies:
        - PolicyName: EC2ReadAndDescribePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowEC2ReadAccess
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: AllowEC2RunInstances
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:CreateTags
                  - ec2:TerminateInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: "*"

  S3Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3LabGroup
      Policies:
        - PolicyName: S3ListAndReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowS3ListBuckets
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: "*"
              - Sid: AllowS3ReadObjects
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - "arn:aws:s3:::*"
                  - "arn:aws:s3:::*/*"

  EC2User2PermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EC2User2PermissionBoundary
      Description: "Permission boundary for ec2-user2. Caps maximum permissions to EC2 read-only and IAM self-service. Instance lifecycle actions are outside the boundary ceiling."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEC2ReadOnly
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeRegions
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: "*"
          - Sid: AllowIAMSelfService
            Effect: Allow
            Action:
              - iam:ChangePassword
              - iam:GetUser
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:user/ec2-user2"

  EC2User1:
    Type: AWS::IAM::User
    DependsOn: TempConsolePassword
    Properties:
      UserName: ec2-user1
      Groups:
        - !Ref EC2Group
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref TempConsolePassword
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: IAMLab
        - Key: Group
          Value: EC2

  EC2User2:
    Type: AWS::IAM::User
    DependsOn:
      - TempConsolePassword
      - EC2User2PermissionBoundary
    Properties:
      UserName: ec2-user2
      Groups:
        - !Ref EC2Group
      PermissionsBoundary: !Ref EC2User2PermissionBoundary
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref TempConsolePassword
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: IAMLab
        - Key: Group
          Value: EC2

  S3User:
    Type: AWS::IAM::User
    DependsOn: TempConsolePassword
    Properties:
      UserName: s3-user
      Groups:
        - !Ref S3Group
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref TempConsolePassword
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: IAMLab
        - Key: Group
          Value: S3

Outputs:

  SecretManagerARN:
    Description: "ARN of the Secrets Manager secret holding the temp password."
    Value: !Ref TempConsolePassword
    Export:
      Name: !Sub "${AWS::StackName}-TempPasswordSecretARN"

  SecretManagerConsoleURL:
    Description: "Direct link to the secret in the AWS Console."
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/secretsmanager/secret?name=${SecretName}&region=${AWS::Region}"

  EC2GroupARN:
    Description: "ARN of the EC2 IAM Group."
    Value: !GetAtt EC2Group.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EC2GroupARN"

  S3GroupARN:
    Description: "ARN of the S3 IAM Group."
    Value: !GetAtt S3Group.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3GroupARN"

  EC2User1ARN:
    Description: "ARN of ec2-user1."
    Value: !GetAtt EC2User1.Arn

  EC2User2ARN:
    Description: "ARN of ec2-user2 (permission boundary applied)."
    Value: !GetAtt EC2User2.Arn

  EC2User2BoundaryARN:
    Description: "ARN of the permission boundary applied to ec2-user2."
    Value: !Ref EC2User2PermissionBoundary

  S3UserARN:
    Description: "ARN of s3-user."
    Value: !GetAtt S3User.Arn

  PasswordRetrievalCommand:
    Description: "AWS CLI command to retrieve the temporary password."
    Value: !Sub >-
      aws secretsmanager get-secret-value
      --secret-id ${SecretName}
      --region ${AWS::Region}
      --query SecretString
      --output text